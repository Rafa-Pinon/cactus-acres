<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CACTUS ACRES</title>

    <!-- Favicon para navegadores -->
    <link rel="icon" type="image/png" href="/icon.png" sizes="500x500" />

    <!-- Icono para dispositivos iOS -->
    <link rel="apple-touch-icon" href="/icon.png" sizes="500x500" />

    <!-- Meta descripción -->
    <meta name="description" content="Sitio web oficial de CACTUS ACRES" />

    <!-- ========================================= -->
    <!-- CONFIGURACIÓN PARA COMPARTIR EL SITIO   -->
    <!-- ========================================= -->

    <!-- Título que aparecerá al compartir -->
    <meta property="og:title" content="CACTUS ACRES" />

    <!-- Descripción que aparecerá al compartir -->
    <meta
      property="og:description"
      content="Sitio web oficial de CACTUS ACRES"
    />

    <!-- Logo que aparecerá al compartir -->
    <meta
      property="og:image"
      content="https://cactusacres.netlify.app/icon.png"
    />

    <!-- URL oficial del sitio -->
    <meta property="og:url" content="https://cactusacres.netlify.app/" />

    <!-- Tipo de contenido -->
    <meta property="og:type" content="website" />

    <!-- Nombre del sitio -->
    <meta property="og:site_name" content="CACTUS ACRES" />

    <!-- ========================================= -->
    <!-- CONFIGURACIÓN PARA X / TWITTER          -->
    <!-- ========================================= -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="CACTUS ACRES" />

    <meta
      name="twitter:description"
      content="Sitio web oficial de CACTUS ACRES"
    />

    <meta
      name="twitter:image"
      content="https://cactusacres.netlify.app/icon.png"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
